kind = "web"
previewPath = "/"
title = "Ragnarok Clicker RPG"
version = "1.0.0"
id = "artifacts/ragnarok-clicker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19647

[services.development]
run = "pnpm --filter @workspace/ragnarok-clicker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ragnarok-clicker", "run", "build" ]
publicDir = "artifacts/ragnarok-clicker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19647"
BASE_PATH = "/"
